{% extends 'base.html' %}

{% block content %}
  <!-- LARGE HERO SECTION -->
  <section class="marketplace-hero">
    <div class="hero-gradient-bg"></div>
    <div class="container-wide marketplace-hero-content">
      <div class="hero-main">
        <p class="hero-eyebrow">Find Premium Opportunities</p>
        <h1 class="hero-title">Discover Your Next Developer Role</h1>
        <p class="hero-subtitle">Curated opportunities from the world's leading tech companies, startups, and teams.</p>
      </div>

      <!-- HERO SEARCH CARD -->
      <div class="marketplace-search-panel">
        <form id="search-form" class="marketplace-search-form">
          <div class="search-row">
            <div class="search-field">
              <label for="search-input" class="search-label">Job title, skill, or company</label>
              <input type="text" name="search" id="search-input" class="search-input" placeholder="e.g. Senior React Engineer" />
            </div>
            <div class="search-field">
              <label for="location-input" class="search-label">Location or remote</label>
              <input type="text" name="location" id="location-input" class="search-input" placeholder="e.g. Manila Philipines" />
            </div>
            <button type="submit" class="search-button btn-primary">Search</button>
          </div>
        </form>

        <div class="search-filters">
          <button class="filter-chip active">All</button>
          <button class="filter-chip">Remote</button>
          <button class="filter-chip">Full-Time</button>
          <button class="filter-chip">Contract</button>
          <button class="filter-chip">Startups</button>
        </div>
      </div>
    </div>
  </section>

  <!-- MARKETPLACE GRID -->
  <section class="marketplace-section">
    <div class="container-wide">
      <div class="marketplace-grid-full">
        <!-- MAIN CONTENT: JOB LISTINGS -->
        <main class="marketplace-main-full">
          <!-- LISTINGS HEADER -->
          <div class="listings-header">
            <div>
              <h2>Available roles</h2>
              <p class="listing-count">{{ active_jobs }}+ open positions</p>
            </div>
            <div class="sort-controls">
              <select class="sort-select">
                <option selected>Most recent</option>
                <option>Most relevant</option>
                <option>Salary: High to low</option>
              </select>
            </div>
          </div>

          <!-- JOB LISTINGS GRID -->
          <div id="job-list" class="job-listings"></div>

          <!-- PAGINATION -->
          <div id="pagination-controls" class="pagination-controls"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- JOB CARD TEMPLATE (Premium Marketplace Style) -->
  <template id="job-card-template">
    <article class="marketplace-job-card">
      <!-- CARD HEADER: Logo + Company Info -->
      <div class="card-company-header">
        <div class="company-logo-wrapper">
          <img class="company-logo" alt="Company logo" />
          <span class="company-initial">C</span>
        </div>
        <div class="company-info">
          <h3 class="job-title"></h3>
          <div class="company-meta">
            <p class="company-name"></p>
            <span class="location-badge">
              <i class="icon-location"></i>
            </span>
          </div>
        </div>
        <button class="card-save-btn" aria-label="Save job">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 2h14a1 1 0 011 1v14.5a1 1 0 01-1.5.87L10 14.13l-6.5 3.87A1 1 0 013 17.5V3a1 1 0 010-1z" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>

      <!-- CARD BODY: Description -->
      <p class="job-summary"></p>

      <!-- CARD META: Badges and Chips -->
      <div class="card-meta-row">
        <div class="badge-group">
          <span class="badge badge-type"></span>
          <span class="badge badge-remote"></span>
        </div>
      </div>

      <!-- CARD SKILLS: Skill chips -->
      <div class="skills-chips"></div>

      <!-- CARD FOOTER: Salary + Apply -->
      <div class="card-footer">
        <div class="salary-display">
          <span class="salary-label">Salary</span>
          <p class="job-salary"></p>
        </div>
        <a class="btn-card-apply btn-primary">Apply now</a>
      </div>
    </article>
  </template>

  <script src="/static/frontend/search.js"></script>
{% endblock %}
